<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Act 1 Scene 3</title>
    <style>
        @view-transition {
            navigation: auto;
        }

        ::view-transition-old(root) {
            animation: fadeOut 0.5s forwards;
        }

        ::view-transition-new(root) {
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        .scroll-border {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        body {
            background-color: #000000;
        }

        .button {
            position: absolute;
            z-index: 4;
            top: 60%;
            left: 20%;
            right: 20%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .button button {
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
            pointer-events: auto;
        }

        .button img {
            display: block;
            width: clamp(40px, 6vw, 80px);
            height: auto;
            transition: transform 0.3s ease-in-out;
        }

        .button img:hover {
            transform: scale(1.2);
        }

        .card-stack {
            position: relative;
            z-index: 1;
            width: min(1100px, 80vw);
            height: 72vh;
            margin: 150px auto 0;
        }

        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card:nth-last-child(n + 4) {
            --y: calc(-50% - 30px);
            transform: translate(-50%, var(--y)) scale(0.9);
            box-shadow: 0 0 1px 1px #00000003;
        }

        .card:nth-last-child(3) {
            --y: calc(-50% - 15px);
            transform: translate(-50%, var(--y)) scale(0.95);
        }

        .card:nth-last-child(2) {
            --y: -50%;
            transform: translate(-50%, var(--y)) scale(1);
        }

        .card:nth-last-child(1) {
            --y: calc(-50% + 15px);
            transform: translate(-50%, var(--y)) scale(1.05);
        }


    </style>
</head>

<body>
    <h1 style="color: #f9f7f7; position: absolute; top: 50px;left: 40.5%; font-size:50px">Act 1 Scene 3</h1>
    <div class="button">
        <button id="previous-card" type="button" aria-label="Previous card">
            <img src="previous arrow.png" alt="">
        </button>
        <button id="next-card" type="button" aria-label="Next card">
            <img src="next arrow.png" alt="">
        </button>
    </div>

    <div class="card-stack">
        <article class="card">
            <img src="panel 16.png" alt="Comic panel 16">
        </article>
        <article class="card">
            <img src="panel 15.png" alt="Comic panel 15">
        </article>
        <article class="card">
            <img src="panel 14.png" alt="Comic panel 14">
        </article>
        <article class="card">
            <img src="panel 13.png" alt="Comic panel 13">
        </article>
        <article class="card">
            <img src="panel 12.png" alt="Comic panel 12">
        </article>
        <article class="card">
            <img src="panel 11.png" alt="Comic panel 11">
        </article>
        <article class="card">
            <img src="panel 10.png" alt="Comic panel 10">
        </article>
        <article class="card">
            <img src="panel 9.gif" alt="Comic panel 9">
        </article>
        <article class="card">
            <img src="panel 8.png" alt="Comic panel 8">
        </article>
        <article class="card">
            <img src="panel 7.png" alt="Comic panel 7">
        </article>
        <article class="card">
            <img src="panel 6.png" alt="Comic panel 6">
        </article>
        <article class="card">
            <img src="panel 5.png" alt="Comic panel 5">
        </article>
        <article class="card">
            <img src="panel 4.png" alt="Comic panel 4">
        </article>
        <article class="card">
            <img src="panel 3.png" alt="Comic panel 3">
        </article>
        <article class="card">
            <img src="panel 2.gif" alt="Comic panel 2">
        </article>
        <article class="card">
            <img src="panel 1.png" alt="Comic panel 1">
        </article>
    </div>

    <img src="border scroll.png" alt="" class="scroll-border">
    <img src="background paper decor.png" alt="" class="paper" width="50%"
        style="position: absolute; top:0%; left: 50%;">
    <img src="white decor.png" alt="" class="paper" width="50%" style="position: absolute; top: 10px; left: 25%;">

    <img src="text deco.png" style="position:absolute; top: 30%; width: 70%;">

    <script>
        const cardStack = document.querySelector(".card-stack");
        const nextButton = document.querySelector("#next-card");
        const previousButton = document.querySelector("#previous-card");

        nextButton.addEventListener("click", () => {
            cardStack.prepend(cardStack.lastElementChild);
        });

        previousButton.addEventListener("click", () => {
            cardStack.append(cardStack.firstElementChild);
        });
    </script>

</body>

</html>
